<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 文化管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <style>
        .ql-toolbar.ql-snow{border-radius:6px 6px 0 0;border-color:#d9d9d9}
        .ql-container.ql-snow{border-radius:0 0 6px 6px;border-color:#d9d9d9;min-height:200px;font-size:14px}
        .ql-editor{min-height:200px}
    </style>
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-flag"></i> 管理后台</div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fas fa-tachometer-alt"></i> 仪表盘</a>
            <a href="users.html"><i class="fas fa-users"></i> 用户管理</a>
            <a href="spots.html"><i class="fas fa-map-marker-alt"></i> 景点管理</a>
            <a href="routes.html"><i class="fas fa-route"></i> 线路管理</a>
            <a href="culture.html"><i class="fas fa-book"></i> 文化管理</a>
            <a href="hotels.html"><i class="fas fa-hotel"></i> 酒店管理</a>
            <a href="foods.html"><i class="fas fa-utensils"></i> 美食管理</a>
            <a href="comments.html"><i class="fas fa-comments"></i> 留言管理</a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> 订单管理</a>
            <a href="faqs.html"><i class="fas fa-question-circle"></i> FAQ管理</a>
            <div style="border-top:1px solid rgba(255,255,255,.12);margin:8px 12px"></div>
            <a href="feedbacks.html"><i class="fas fa-bullhorn"></i> 问题反馈</a>
            <a href="route-review.html"><i class="fas fa-clipboard-check"></i> 线路审核</a>
            <a href="spot-review.html"><i class="fas fa-search-plus"></i> 景点审核</a>
            <a href="permissions.html"><i class="fas fa-shield-alt"></i> 权限配置</a>
            <a href="customer-service.html"><i class="fas fa-headset"></i> 人工客服</a>
        </nav>
    </aside>
    <div class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h1>文化管理</h1>
            <div class="top-bar-right"><span id="adminName"></span> <a href="#" onclick="doLogout()">退出</a></div>
        </header>
        <div class="content">
            <div class="card">
                <div class="card-header"><h2>分类管理</h2></div>
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;">
                    <input class="form-control" id="newCatName" placeholder="新分类名称" style="width:200px">
                    <button class="btn btn-primary btn-sm" onclick="addCategory()"><i class="fas fa-plus"></i> 添加分类</button>
                </div>
                <div class="tag-list" id="categoryTags"><span class="loading"><i class="fas fa-spinner fa-spin"></i></span></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>文化内容</h2>
                    <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> 新增内容</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>ID</th><th>封面</th><th>标题</th><th>分类</th><th>作者</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="formModal">
    <div class="modal" style="width:640px">
        <div class="modal-header"><h3 id="modalTitle">新增内容</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
            <input type="hidden" id="fId">
            <div class="form-group"><label>标题</label><input class="form-control" id="fTitle" placeholder="内容标题"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>分类</label>
                    <select class="form-control" id="fCategoryId"></select>
                </div>
                <div class="form-group"><label>作者</label><input class="form-control" id="fAuthor" placeholder="作者"></div>
            </div>
            <div class="form-group"><label>内容（支持富文本）</label><div id="fContentEditor"></div><input type="hidden" id="fContent"></div>
            <div class="form-group">
                <label>封面图片</label>
                <div class="img-upload-area">
                    <img id="coverPreview" src="" style="display:none" onerror="imgError(this)">
                    <input type="file" id="coverFile" accept="image/*" onchange="handleUpload()">
                    <input type="hidden" id="fCoverImage">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="saveItem()"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="js/admin-common.js"></script>
<script>
if (!requireAdmin()) throw '';
renderSidebar();

let currentPage = 1;
let categories = [];

const quill = new Quill('#fContentEditor', {
    theme: 'snow',
    placeholder: '请输入文化内容（支持图片、表格等富文本格式）…',
    modules: {
        toolbar: [
            [{ header: [1,2,3,false] }],
            ['bold','italic','underline','strike'],
            [{ color: [] }, { background: [] }],
            [{ list:'ordered' }, { list:'bullet' }],
            ['blockquote','code-block'],
            ['link','image'],
            ['clean']
        ]
    }
});

async function loadCategories() {
    const data = await api('/api/culture/categories');
    categories = data || [];
    let h = '';
    categories.forEach(c => {
        const name = typeof c === 'string' ? c : (c.name || c.categoryName || '');
        const id = typeof c === 'string' ? c : (c.id || '');
        h += `<span class="tag">${escHtml(name)} <span class="tag-del" onclick="deleteCategory('${id}')">&times;</span></span>`;
    });
    if (!categories.length) h = '<span style="color:#999">暂无分类</span>';
    document.getElementById('categoryTags').innerHTML = h;
    updateCategorySelect();
}

function updateCategorySelect() {
    const sel = document.getElementById('fCategoryId');
    let h = '<option value="">请选择分类</option>';
    categories.forEach(c => {
        const name = typeof c === 'string' ? c : (c.name || c.categoryName || '');
        const id = typeof c === 'string' ? c : (c.id || '');
        h += `<option value="${id}">${escHtml(name)}</option>`;
    });
    sel.innerHTML = h;
}

async function addCategory() {
    const name = document.getElementById('newCatName').value.trim();
    if (!name) { showToast('请输入分类名称', 'warning'); return; }
    const data = await api('/api/admin/culture/saveCategory?name=' + encodeURIComponent(name));
    if (data !== null) { showToast('添加成功'); document.getElementById('newCatName').value = ''; loadCategories(); }
}

function deleteCategory(id) {
    showConfirm('确定删除该分类吗？该分类下的内容也将受影响。', async () => {
        const data = await api('/api/admin/culture/deleteCategory?id=' + encodeURIComponent(id));
        if (data !== null) { showToast('删除成功'); loadCategories(); }
    });
}

async function loadData(page) {
    currentPage = page;
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</td></tr>';
    const data = await api(`/api/culture/list?page=${page}&size=10`);
    if (!data) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty-state">加载失败</td></tr>'; return; }

    const list = data.records || data.list || data || [];
    const total = data.pages || data.totalPages || Math.ceil((data.total || list.length) / 10);
    if (!list.length) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty-state"><i class="fas fa-inbox"></i> 暂无数据</td></tr>'; document.getElementById('pagination').innerHTML = ''; return; }

    let h = '';
    list.forEach(c => {
        const cover = c.coverImage ? `<img src="${imgSrc(c.coverImage)}" class="img-preview" onerror="imgError(this)">` : '-';
        const catName = c.categoryName || c.category || '-';
        h += `<tr>
            <td>${c.id}</td>
            <td>${cover}</td>
            <td>${escHtml(c.title)}</td>
            <td>${escHtml(catName)}</td>
            <td>${escHtml(c.author || '-')}</td>
            <td class="action-btns">
                <button class="btn btn-sm btn-info" onclick="editItem(${c.id})"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${c.id})"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`;
    });
    document.getElementById('tableBody').innerHTML = h;
    renderPagination('pagination', currentPage, total, 'loadData');
}

function openModal(item) {
    document.getElementById('modalTitle').textContent = item ? '编辑内容' : '新增内容';
    document.getElementById('fId').value = item ? item.id : '';
    document.getElementById('fTitle').value = item ? item.title || '' : '';
    if (item && item.content) {
        quill.root.innerHTML = item.content;
    } else {
        quill.setContents([]);
    }
    document.getElementById('fAuthor').value = item ? item.author || '' : '';
    document.getElementById('fCoverImage').value = item ? item.coverImage || '' : '';
    const preview = document.getElementById('coverPreview');
    if (item && item.coverImage) { preview.src = imgSrc(item.coverImage); preview.style.display = ''; } else { preview.style.display = 'none'; }
    document.getElementById('coverFile').value = '';
    updateCategorySelect();
    if (item) document.getElementById('fCategoryId').value = item.categoryId || '';
    document.getElementById('formModal').classList.add('active');
}

function closeModal() { document.getElementById('formModal').classList.remove('active'); }

async function editItem(id) {
    const data = await api('/api/culture/detail?id=' + id);
    if (data) openModal(data);
}

async function handleUpload() {
    const url = await uploadFile(document.getElementById('coverFile'));
    if (url) {
        document.getElementById('fCoverImage').value = url;
        document.getElementById('coverPreview').src = imgSrc(url);
        document.getElementById('coverPreview').style.display = '';
    }
}

async function saveItem() {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { showToast('请输入标题', 'warning'); return; }
    const fields = { title, content: quill.root.innerHTML.trim(),
        categoryId: document.getElementById('fCategoryId').value, author: document.getElementById('fAuthor').value.trim(),
        coverImage: document.getElementById('fCoverImage').value };
    const id = document.getElementById('fId').value;
    if (id) fields.id = id;
    const params = Object.entries(fields).filter(([,v]) => v !== '').map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const data = await api('/api/admin/culture/save?' + params);
    if (data !== null) { showToast('保存成功'); closeModal(); loadData(currentPage); }
}

function deleteItem(id) {
    showConfirm('确定要删除该内容吗？', async () => {
        const data = await api('/api/admin/culture/delete?id=' + id);
        if (data !== null) { showToast('删除成功'); loadData(currentPage); }
    });
}

loadCategories();
loadData(1);
</script>
</body>
</html>
